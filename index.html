<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>カード帳ツール | HTML5 Tools</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://html5tools.netlify.app/html5tools-title.css">
        <link rel="stylesheet" href="https://html5tools.netlify.app/html5tools-footer.css">
        <script src="script.js" defer></script>
		<script src="https://html5tools.netlify.app/script.js" defer></script>
        <link rel="icon" type="image/png" href="icon.png" id="icon">
    </head>
    <body>
        <p class="center" id="catchcopy">だれでも、いつでも、Webで使えるツール集</p>
        <a id="title" href="https://html5tools.netlify.app/">HTML5 Tools</a>
        <p id="tooltitle" class="center">カード帳ツール</p>
        <!-- <button id="darkModeButton"></button> -->
        <p class="center" id="tooldesc">内容を自由にカスタマイズ可能なカード帳をつくれるツール。</p>
        <div id="card" state="omote">
            <p id="card-text">---</p>
            <p id="card-prev">---</p>
            <p id="card-num">--- / ---</p>
            <p id="card-info">枠内をクリックして次のカードを開きます...</p>
            <button id="check-button" hidden>✓</button>
        </div>
        <h2 id="settings">設定</h2>
        <textarea placeholder="カードの表の文字列（一行につき一枚）" id="card-omote-input"></textarea>
        <textarea placeholder="カードの裏の文字列（一行につき一枚）" id="card-ura-input"></textarea>
        <div id="checkboxes">
            <input type="checkbox" id="hideInfo">
            <label for="hideInfo">操作方法（「枠内をクリックして次のカードを開きます...」）を表示しない</label>
        </div>
        <div id="buttons">
            <button id="gen-card">シャッフルしカード帳を作る</button>
            <button id="save-settings">データをマニュアルでセーブ</button>
            <button id="scroll-to-card">カードまでスクロール</button>
            <button id="filterChecked">✓がつけられたカードを除外</button>
        </div>
        <h3>プロファイル</h3>
        <div><span id="profiles"></span><button id="add-profile">追加</button></div>
        <footer>
            <p><span id="copyright"></span> | ライセンス: Apache License 2.0 | <a href="https://x.gd/H5T_card_src" download>ソースコードをダウンロード</a> | <a href="https://forms.gle/riqVmYtL7mRj38V29">フィードバック</a></p>
        </footer>
    </body>
</html>
